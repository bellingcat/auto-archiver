name: Platform Status Check

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:       # allow manual runs

permissions:
  contents: write

jobs:
  status-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install latest Poetry
        run: pipx install poetry

      - name: Cache Poetry and pip artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-status-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run barebones status check
        run: |
          poetry run auto-archiver-status \
            --output status_report.json
        continue-on-error: true

      - name: Generate summary
        run: |
          python3 -c "
          import json, datetime
          with open('status_report.json') as f:
              records = json.load(f)
          summary = {
              'last_run': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'aa_version': records[0]['aa_version'] if records else 'unknown',
              'platforms': {}
          }
          for r in records:
              key = r['platform_name']
              if key not in summary['platforms']:
                  summary['platforms'][key] = {}
              summary['platforms'][key][r['content_type']] = {
                  'config': r['config_label'],
                  'accessible': r['is_content_accessible'],
                  'archived': r['is_content_archived'],
              }
          with open('platform_status.json', 'w') as f:
              json.dump(summary, f, indent=2)
          lines = [
              '# Platform Status',
              '',
              f'Last run: {summary[\"last_run\"]}  ',
              f'Auto Archiver version: {summary[\"aa_version\"]}',
              '',
              '| Platform | Content Type | Config | Accessible | Archived |',
              '|----------|-------------|--------|------------|----------|',
          ]
          footnotes = {
              'youtube': 'YouTube will normally only work when using an account (cookies) or a proxy, as it blocks anonymous requests from datacenter IPs such as GitHub runners.',
          }
          for r in records:
              ok_a = ':white_check_mark:' if r['is_content_accessible'] else ':x:'
              ok_b = ':white_check_mark:' if r['is_content_archived'] else ':x:'
              name = r['platform_name'] + ('\\\\*' if r['platform_name'] in footnotes else '')
              lines.append(f'| {name} | {r[\"content_type\"]} | {r[\"config_label\"]} | {ok_a} | {ok_b} |')
          used = sorted({r['platform_name'] for r in records} & footnotes.keys())
          if used:
              lines.append('')
              lines.extend(f'\\\\* {footnotes[p]}' for p in used)
          md = '\n'.join(lines) + '\n'
          with open('PLATFORM_STATUS.md', 'w') as f:
              f.write(md)
          print(md)
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: platform-status-report
          path: status_report.json
          retention-days: 90

      # main is protected, so results are published to the platform-status branch,
      # whose README.md is always the latest report
      - name: Publish to platform-status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/platform-status"
          if git fetch --depth=1 origin platform-status; then
            git worktree add -B platform-status "$dir" FETCH_HEAD
          else
            git worktree add --orphan -b platform-status "$dir"
          fi
          cp PLATFORM_STATUS.md "$dir/README.md"
          cp platform_status.json status_report.json "$dir/"
          cd "$dir"
          git add README.md platform_status.json status_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update platform status report [skip ci]"
            git push origin platform-status
          fi
